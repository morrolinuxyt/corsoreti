name: Build and Push Docker image

on:
  push:
    branches:
      - master  # main o master, dipende dal tuo branch principale

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Oltre a latest, ogni build ha un tag immutabile con lo SHA corto del
      # commit (es. sha-12c5acf): rollback immediato e versione fissabile
      # nel manifest k8s.
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: morrolinux/corsoreti-it
          tags: |
            type=sha
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

